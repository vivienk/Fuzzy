name: Native PICO APK
on: pull_request
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: ./gradlew clean :app:mergeDebugAssets :app:assembleDebug :app:testDebugUnitTest
      - run: cp app/build/outputs/apk/debug/app-debug.apk Fuzzy-V3-Christmas-Worlds.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Fuzzy-V3-Christmas-Worlds
          path: Fuzzy-V3-Christmas-Worlds.apk
